<text x="57.63" y="49.8" font-family="'Outfit','Inter','Helvetica Neue','Arial',sans-serif" font-size="12.0px" fill="#231f20" xml:space="preserve">Warranty Service</text>
<text x="46.76" y="141.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">DEERMA shall not be liable for any costs, damages, or repairs resulting from the following conditions:</text>
<text x="46.76" y="159.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Normal wear and tear.</text>
<text x="46.76" y="177.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">For commercial, professional or non-household use, unless the product is explicitly designated for</text>
<text x="46.76" y="185.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">such use.</text>
<text x="46.76" y="203.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Consumables and accessories.</text>
<text x="46.76" y="221.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Non-compliance with the user instructions. Defects caused by rough or inappropriate handling or</text>
<text x="46.76" y="229.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">use.</text>
<text x="46.76" y="247.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Damage caused by accident (e.g., impact, shock, exposure to liquid), fire, water, lightning or other</text>
<text x="46.76" y="255.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">acts of nature.</text>
<text x="46.76" y="273.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Damage caused by incompatible or non-approved accessories or components.</text>
<text x="46.76" y="291.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Willful or deliberate damage, neglect or negligence.</text>
<text x="46.76" y="309.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Repairs, modifications, or disassembly performed by unauthorized persons or agents.</text>
<text x="46.76" y="327.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Any alteration or modification to the product.</text>
<text x="46.76" y="345.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">Products purchased from unauthorized sellers/dealers/resellers, unless otherwise required by</text>
<text x="46.76" y="353.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">applicable law.</text>
<text x="46.76" y="371.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">In case of a product fault or for any warranty questions, please reach out to the seller with your</text>
<text x="46.76" y="379.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">purchase receipt. You may also contact DEERMA customer support directly for further assistance. For</text>
<text x="46.76" y="387.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">complete information on consumer warranty benefits, visit DEERMA's official website at</text>
<text x="46.76" y="395.7" font-family="'MiSans','PingFang SC',sans-serif" font-size="7.0px" fill="#6d6e71" xml:space="preserve">http://www.deerma.com.</text>
<text x="46.71" y="102.7" font-family="'MiSans-SemiBold','MiSans','PingFang SC',sans-serif" font-size="8.0px" fill="#231f20" xml:space="preserve">This warranty gives you specific legal rights, and you may also have other rights</text>
<text x="46.71" y="112.7" font-family="'MiSans-SemiBold','MiSans','PingFang SC',sans-serif" font-size="8.0px" fill="#231f20" xml:space="preserve">which vary by country. The duration and conditions related to the legal warranties are</text>
<text x="46.71" y="122.7" font-family="'MiSans-SemiBold','MiSans','PingFang SC',sans-serif" font-size="8.0px" fill="#231f20" xml:space="preserve">provided by respective local laws.</text>
</svg>