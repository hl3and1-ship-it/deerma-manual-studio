          '草稿箱',
        '</div>',
        '<span id="draft-box-count" style="font-size:11px;color:var(--muted);font-weight:500;">0/' + MAX_DRAFTS + '</span>',
      '</div>',
      '<div style="padding:10px 12px;border-bottom:1px solid var(--border);">',
        '<button id="draft-box-save" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:filter .15s;">',
          '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8V3"></path></svg>',
          '保存当前为草稿',
        '</button>',
        '<div id="draft-box-hint" style="margin-top:8px;font-size:11px;color:var(--muted);line-height:1.4;display:none;">已开启捕获，请在弹出的保存窗口中点击「保存」，系统将自动把项目存为草稿。</div>',
      '</div>',
      '<div id="draft-box-list" style="flex:1;overflow:auto;padding:6px;"></div>',
    ].join('');
    document.body.appendChild(panel);

    var saveBtn = panel.querySelector('#draft-box-save');
    var hint = panel.querySelector('#draft-box-hint');
    saveBtn.addEventListener('click', function () {
      saveBtn.disabled = true;
      var originalHtml = saveBtn.innerHTML;
      saveBtn.innerHTML = '等待保存…';
      hint.style.display = 'block';
      saveCurrentDraft(function (err) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalHtml;
        hint.style.display = 'none';
        if (err) { alert(err.message); return; }
        renderList();
        showPosterToast('草稿已保存', 'success');
      });
    });

    listRoot = panel.querySelector('#draft-box-list');
    countBadge = panel.querySelector('#draft-box-count');
    return panel;
  }

  function renderList() {
    if (!listRoot) return;
    var drafts = getDrafts();
    if (countBadge) countBadge.textContent = drafts.length + '/' + MAX_DRAFTS;
    if (drafts.length === 0) {
      listRoot.innerHTML = '<div style="padding:24px 12px;text-align:center;color:var(--muted);font-size:12px;">暂无草稿<br>编辑后可点击上方按钮保存</div>';
      return;
    }
    listRoot.innerHTML = '';
    drafts.forEach(function (d) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;margin-bottom:4px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s;';
      row.innerHTML = [
        '<div style="flex:1;min-width:0;">',
          '<div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;">' + escapeHtml(d.name) + '</div>',
          '<div style="font-size:11px;color:var(--muted);margin-top:2px;">' + formatTime(d.createdAt) + ' \xb7 ' + formatSize(d.size) + '</div>',
        '</div>',
        '<button class="draft-load" data-id="' + d.id + '" style="flex-shrink:0;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:11px;cursor:pointer;">\u52a0\u8f7d</button>',
        '<button class="draft-del" data-id="' + d.id + '" style="flex-shrink:0;width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" title="\u5220\u9664">',
          '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>',
        '</button>'
      ].join('');
      row.querySelector('.draft-load').addEventListener('click', function () { loadDraft(this.getAttribute('data-id')); });
      row.querySelector('.draft-del').addEventListener('click', function () {
        if (confirm('\u786e\u5b9a\u5220\u9664\u8be5\u8349\u7a3f\u5417\uff1f')) { deleteDraft(this.getAttribute('data-id')); renderList(); }
      });
      listRoot.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function openPanel() {
    if (!panel) createPanel();
    panel.style.display = 'flex';
    renderList();
    positionPanel();
  }
  function closePanel() {
    if (panel) panel.style.display = 'none';
  }
  function togglePanel() {
    if (panel && panel.style.display === 'flex') closePanel(); else openPanel();
  }
  function positionPanel() {
    if (!draftBtn || !panel) return;
    var rect = draftBtn.getBoundingClientRect();
    panel.style.left = Math.max(8, rect.left) + 'px';
    panel.style.top = (rect.bottom + 6) + 'px';
  }

  // ===================== 返回首页按钮 =====================
  function injectHomeButton() {
    if (document.getElementById('poster-home-btn')) return;
    var templateBtn = document.querySelector('header button[title="保存为模板"]');
    if (!templateBtn) return;

    var wrapper = document.createElement('div');
    wrapper.className = 'relative';
    wrapper.innerHTML = '<button type="button" title="返回首页" class="flex items-center gap-1 h-8 px-2 rounded-md border border-[color:var(--border)] bg-[color:var(--surface-2)] text-[color:var(--ink)] text-[12px] hover:bg-[color:var(--surface)] transition-colors" id="poster-home-btn"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span class="hidden sm:inline">返回首页</span></button>';
    var homeBtn = wrapper.querySelector('#poster-home-btn');
    homeBtn.addEventListener('click', function () {
      window.location.href = '../';
    });

    var parent = templateBtn.parentElement;
    if (parent && parent.parentElement) {
      parent.parentElement.insertBefore(wrapper, parent);
    }
  }

  // ===================== 注入工具栏按钮 =====================
  var draftBtn = null;
  var draftListenersAdded = false;
  function injectDraftButton() {
    if (draftBtn && document.contains(draftBtn)) return;
    var header = document.querySelector('header');
    if (!header) return;
    var saveBtn = findButtonByText(['保存文件']);
    if (!saveBtn) return;

    var wrapper = document.createElement('div');
    wrapper.className = 'relative';
    wrapper.innerHTML = '<button type="button" title="草稿箱" class="flex items-center gap-1 h-8 px-2 rounded-md border border-[color:var(--border)] bg-[color:var(--surface-2)] text-[color:var(--ink)] text-[12px] hover:bg-[color:var(--surface)] transition-colors" id="poster-draft-btn"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open" aria-hidden="true"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h13.4a2 2 0 0 1 1.6.8l1.5 2A2 2 0 0 1 21 8.5V16a2 2 0 0 1-2 2h-1"></path></svg><span class="hidden sm:inline">草稿箱</span></button>';
    draftBtn = wrapper.querySelector('#poster-draft-btn');
    draftBtn.addEventListener('click', function (e) { e.stopPropagation(); togglePanel(); });

    var parent = saveBtn.parentElement;
    if (parent && parent.parentElement === header.children[1]) {
      parent.parentElement.insertBefore(wrapper, parent);
    } else {
      header.children[1].appendChild(wrapper);
    }

    if (!draftListenersAdded) {
      draftListenersAdded = true;
      document.addEventListener('click', function (e) {
        if (panel && panel.style.display === 'flex' && !panel.contains(e.target) && e.target !== draftBtn && !draftBtn.contains(e.target)) {
          closePanel();
        }
      });
      window.addEventListener('resize', positionPanel);
    }
  }

  // ===================== 模板/组件导入增强 =====================
  function showPosterToast(message, type) {
    var existing = document.getElementById('poster-toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.id = 'poster-toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20000;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;background:' + (type === 'error' ? '#c62828' : '#2e7d32') + ';box-shadow:0 8px 24px rgba(0,0,0,0.2);';
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function () { el.remove(); }, 300); }, 3000);
  }

  function parseImportJson(text) {
    try { return JSON.parse(text); } catch (e) { return null; }
  }

  function convertToTemplateSeed(item) {
    if (!item || typeof item !== 'object') return null;
    var doc = item.doc || item;
    if (!doc || !Array.isArray(doc.pages)) return null;
    return {
      id: 'tpl_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      name: (item.name || 'Imported template').toString().trim() || 'Imported template',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      doc: {
        pages: doc.pages,
        pageStandard: doc.pageStandard,
        canvasSettings: doc.canvasSettings,
        dpi: doc.dpi || 300,
        colorMode: doc.colorMode || 'rgb',
        cmykProfile: doc.cmykProfile,
        rgbProfile: doc.rgbProfile,
        settingsLocked: !!doc.settingsLocked
      }
    };
  }

  function convertToComponentSeed(item) {
    if (!item || typeof item !== 'object') return null;
    var elements = item.elements || (item.doc && item.doc.elements);
    if (!Array.isArray(elements) || elements.length === 0) return null;
    return {
      id: 'cmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      name: (item.name || 'Imported component').toString().trim() || 'Imported component',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      elements: elements
    };
  }

  function saveTemplateSeeds(seeds) {
    if (!seeds || seeds.length === 0) return 0;
    var key = 'manual-design:project-templates';
    var arr = [];
    try {
      var raw = localStorage.getItem(key);
      arr = raw ? JSON.parse(raw) : [];
    } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    for (var i = 0; i < seeds.length; i++) arr.push(seeds[i]);
    localStorage.setItem(key, JSON.stringify(arr));
    return seeds.length;
  }

  function saveComponentSeeds(seeds) {
    if (!seeds || seeds.length === 0) return 0;
    var key = 'manual-design:components';
    var arr = [];
    try {
      var raw = localStorage.getItem(key);
      arr = raw ? JSON.parse(raw) : [];
    } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    for (var i = 0; i < seeds.length; i++) arr.push(seeds[i]);
    localStorage.setItem(key, JSON.stringify(arr));
    return seeds.length;
  }

  function processImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data = parseImportJson(reader.result);
      if (!data) {
        showPosterToast('导入失败：文件不是有效的 JSON', 'error');
        return;
      }
      var items = Array.isArray(data) ? data : [data];
      var tplSeeds = [];
      var cmpSeeds = [];
      for (var i = 0; i < items.length; i++) {
        var tpl = convertToTemplateSeed(items[i]);
        if (tpl) tplSeeds.push(tpl);
        var cmp = convertToComponentSeed(items[i]);
        if (cmp) cmpSeeds.push(cmp);
      }
      if (tplSeeds.length === 0 && cmpSeeds.length === 0) {
        showPosterToast('导入失败：未找到有效的模板或组件数据', 'error');
        return;
      }
      var savedTpl = saveTemplateSeeds(tplSeeds);
      var savedCmp = saveComponentSeeds(cmpSeeds);
      var parts = [];
      if (savedTpl) parts.push(savedTpl + ' \u4e2a\u6a21\u677f');
      if (savedCmp) parts.push(savedCmp + ' \u4e2a\u7ec4\u4ef6');
      showPosterToast('\u5df2\u5bfc\u5165 ' + parts.join('\u3001') + '\uff0c\u5373\u5c06\u5237\u65b0\u2026', 'success');
      setTimeout(function () { location.reload(); }, 1200);
    };
    reader.onerror = function () {
      showPosterToast('读取文件失败', 'error');
    };
    reader.readAsText(file);
  }

  function injectImportFix() {
    if (document.getElementById('poster-import-fix-input')) return;
    var input = document.createElement('input');
    input.id = 'poster-import-fix-input';
    input.type = 'file';
    input.accept = '.json,.mdoc,application/json';
    input.className = 'hidden';
    input.style.display = 'none';
    input.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      input.value = '';
      if (file) processImportFile(file);
    });
    document.body.appendChild(input);

    document.addEventListener('click', function (e) {
      var el = e.target;
      if (!el || el.tagName !== 'BUTTON') return;
      var text = (el.textContent || '').trim();
      var title = (el.getAttribute('title') || '').toLowerCase();
      if (text !== '\u5bfc\u5165') return;
      if (title.indexOf('json') === -1 && title.indexOf('\u5bfc\u5165') === -1) return;
      var parent = el.parentElement;
      var hasExportSeed = false;
      if (parent) {
        var siblings = parent.querySelectorAll('button');
        for (var i = 0; i < siblings.length; i++) {
          if ((siblings[i].textContent || '').trim() === '\u5bfc\u51fa\u79cd\u5b50') { hasExportSeed = true; break; }
        }
      }
      if (!hasExportSeed) return;
      e.preventDefault();
      e.stopPropagation();
      input.click();
    }, true);
  }

  // ===================== 持续守护（防 React 重渲染清除注入按钮）=====================
  var headerObserver = null;
  var headerObserveTimer = null;
  function ensureInjectedButtons() {
    injectHomeButton();
    injectDraftButton();
    injectImportFix();
  }
  function observeHeader() {
    if (headerObserver) return;
    var header = document.querySelector('header');
    if (!header) return;
    headerObserver = new MutationObserver(function (mutations) {
      if (headerObserveTimer) clearTimeout(headerObserveTimer);
      headerObserveTimer = setTimeout(function () {
        if (!document.getElementById('poster-home-btn') || !(draftBtn && document.contains(draftBtn))) {
          ensureInjectedButtons();
        }
      }, 50);
    });
    headerObserver.observe(header, { childList: true, subtree: true });
  }

  // ===================== 等待应用挂载后注入 =====================
  function tryInject() {
    var homeExists = !!document.getElementById('poster-home-btn');
    var draftExists = !!(draftBtn && document.contains(draftBtn));
    if (homeExists && draftExists) {
      observeHeader();
      return;
    }
    if (document.querySelector('header') && findButtonByText(['保存文件'])) {
      ensureInjectedButtons();
      observeHeader();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(tryInject, 300); });
  } else {
    setTimeout(tryInject, 300);
  }
  var injectTimer = setInterval(function () {
    tryInject();
    var homeExists = !!document.getElementById('poster-home-btn');
    var draftExists = !!(draftBtn && document.contains(draftBtn));
    if (homeExists && draftExists && headerObserver) clearInterval(injectTimer);
  }, 800);
  setTimeout(function () { clearInterval(injectTimer); }, 15000);
})();
</script>
</body></html>
